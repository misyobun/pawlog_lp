<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pawlogs</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;
display:flex;justify-content:center;align-items:center;
min-height:100vh;margin:0;
background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
color:#333}
.card{background:#fff;border-radius:20px;padding:40px;
max-width:400px;width:90%;text-align:center;
box-shadow:0 20px 60px rgba(0,0,0,.3)}
.icon{font-size:64px;margin-bottom:16px}
h1{font-size:22px;margin:0 0 12px;color:#333}
p{color:#666;margin:8px 0;line-height:1.6;font-size:14px}
.btn{display:inline-block;padding:14px 32px;
border-radius:12px;text-decoration:none;
font-weight:600;font-size:16px;
color:#fff;background:#667eea;margin:8px;
transition:opacity .2s}
.btn:active{opacity:.7}
.btn-safari{background:#007AFF;color:#fff}
.btn-store{background:#eee;color:#333}
.hint{color:#888;font-size:13px;margin:16px 0 8px;line-height:1.6}
.not-found h1{font-size:20px;color:rgba(0,0,0,.6)}
.not-found p{font-size:14px}
</style>
</head>
<body>
<div class="card" id="content"></div>
<script>
(function(){
  var path = location.pathname;
  var match = path.match(/\/invite\/([^\/]+)/);

  if (!match) {
    document.getElementById('content').innerHTML =
      '<div class="not-found">' +
      '<div class="icon">🐾</div>' +
      '<h1>Page Not Found</h1>' +
      '<p>お探しのページが見つかりませんでした。</p>' +
      '<a class="btn" href="/">トップページへ</a>' +
      '</div>';
    return;
  }

  var token = match[1];
  var customScheme = 'pawlog://invite/' + token;
  var universalLink = location.href;
  var storeUrl = 'https://apps.apple.com/app/id6743432182';

  var ua = navigator.userAgent || '';
  var isInApp = /Line|FBAN|FBAV|Instagram|Twitter|Weibo|MicroMessenger/i.test(ua);

  var html =
    '<div class="icon">🐾</div>' +
    '<h1>ペットの共有に招待されています</h1>' +
    '<p>にくきゅう記録で招待を確認してください</p>';

  if (isInApp) {
    html +=
      '<a class="btn" id="openApp" href="' + customScheme + '">' +
      'アプリで開く</a>' +
      '<p class="hint">アプリが開かない場合は<br>' +
      '下のボタンからブラウザで開いてください</p>' +
      '<a class="btn btn-safari" href="' + universalLink + '" ' +
      'target="_blank">ブラウザで開く</a>';
  } else {
    html +=
      '<a class="btn" href="' + universalLink + '">' +
      'アプリで開く</a>';
  }

  html +=
    '<br>' +
    '<a class="btn btn-store" href="' + storeUrl + '">' +
    'App Store からダウンロード</a>';

  document.getElementById('content').innerHTML = html;

  if (isInApp) {
    try { location.href = customScheme; } catch(e) {}
  }
})();
</script>
</body>
</html>
